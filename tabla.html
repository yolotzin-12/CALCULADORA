<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Libro de alumnos</title>
    <link href="practicasjsd/css/bootstrap.css" rel="stylesheet"/>
</head>
<body>
    <header>
        <nav class="navbar bg-black">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="#">Bienvenidos al 3-D</a>
            </div>
        </nav>
    </header>
    <hr>
    <main>

        <div class="container">
            <div class="row">

                <div class="col-md-6 col-sm-12">
            <table class="table table-hover" id="tabla_alumnos">
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Telefono</th>
                <th>Matricula</th>
                <th>Imagen perfil</th>
            </tr>
        </table>

            <button class="btn btn-primary" type="button" id="agregar">Pintar alumno</button>
                </div>
            <div class="col-md-6 col-sm-12">
                <form action="#" method="post" id="formulario">

                    <div class="mb-3">
                        <br>
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control"/>
                        <br>
                        <label for="apellido" class="form-label">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" class="form-control"/>
                        <br>
                        <label for="edad" class="form-label">Edad:</label>
                        <input type="text" id="edad" name="edad" class="form-control"/>
                        <br>
                        <label for="telefono" class="form-label">Telefono:</label>
                        <input type="text" id="telefono" name="telefono" class="form-control"/>
                    </div>



                    <br>
                    <button class="btn btn-primary" type="button" id="create">Nuevo alumno/a</button>
                </form>
            </div>
            </div>
        </div>
    </main>

    <footer class="fixed-bottom py-3 bg-dark text-light">
        <div class="container text-center">
            <p>Página realizada por el 3-D - Todos lo derechos reservados</p>
        </div>
    </footer>
<script src="practicasjsd/js/tabla.js"></script>
<script src="practicasjsd/js/bootstrap.js"></script>
</body>
</html>
